name: Deploy Frontend to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Prepare the static metadata file inside the frontend folder
          cat <<EOF > frontend/README.md
---
title: QR Elite Designer
emoji: 💎
colorFrom: indigo
colorTo: slate
sdk: static
pinned: false
---

# QR Elite Designer
Professional QR Identity Studio.
EOF
          
          # 2. Use the official HF Hub tool to upload the frontend directory
          # This replaces the manual git push and is much more reliable for Spaces
          python -c "
from huggingface_hub import HfApi
import os

api = HfApi(token=os.environ['HF_TOKEN'])
api.upload_folder(
    folder_path='frontend',
    repo_id='ShreyData/qr-elite',
    repo_type='space',
    delete_patterns='*' # This ensures a clean sync
)
"
