name: Deploy Frontend to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**' # Only deploy if frontend files change

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure Git
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Use a temporary directory to prepare the HF repo structure
          mkdir -p deploy_temp
          cp -r frontend/* deploy_temp/
          cd deploy_temp
          
          # Initialize a new git repo and push to HF
          git init
          git add .
          git commit -m "Deploy frontend from GitHub Actions"
          git remote add hf https://ShreyData:${HF_TOKEN}@huggingface.co/spaces/ShreyData/qr-elite
          git push -f hf master:main
