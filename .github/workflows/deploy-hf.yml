name: Deploy Frontend to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Prepare clean deployment directory
          mkdir -p hf_sync
          cp -r frontend/* hf_sync/
          cd hf_sync
          
          # 2. Add the mandatory HF configuration
          cat <<EOF > README.md
---
title: QR Elite Designer
emoji: 💎
colorFrom: indigo
colorTo: slate
sdk: static
pinned: false
---

# QR Elite Designer
Professional QR Identity Studio.
EOF

          # 3. Use the exact Git logic from the first successful connection
          git init
          git config user.email "bot@github.com"
          git config user.name "HF Deploy Bot"
          git add .
          git commit -m "Deploy: Professional UI Update v2"
          
          # Force push from local master to remote main
          # This was the only command that successfully reached your HF Space
          git remote add hf https://ShreyData:${HF_TOKEN}@huggingface.co/spaces/ShreyData/qr-elite
          git push -f hf master:main
