name: Deploy Frontend to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Create the mandatory metadata file
          cat <<EOF > frontend/README.md
---
title: QR Elite Designer
emoji: 💎
colorFrom: indigo
colorTo: slate
sdk: static
pinned: false
---

# QR Elite Designer
Professional QR Identity Studio.
EOF
          
          # 2. Debug: List files to ensure we are in the right place
          echo "Files to be uploaded:"
          ls -R frontend/
          
          # 3. Use the official HF Hub tool with explicit commit message
          python -c "
from huggingface_hub import HfApi
import os
import sys

try:
    api = HfApi(token=os.environ['HF_TOKEN'])
    print('Starting upload to ShreyData/qr-elite...')
    
    api.upload_folder(
        folder_path='frontend',
        repo_id='ShreyData/qr-elite',
        repo_type='space',
        path_in_repo='',
        commit_message='ELITE_DEPLOY: Update professional UI and assets',
        commit_description='Deployed via GitHub Actions'
    )
    print('Upload completed successfully!')
except Exception as e:
    print(f'ERROR DURING DEPLOYMENT: {e}')
    sys.exit(1)
"
