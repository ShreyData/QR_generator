name: Deploy Frontend to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-hf.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Prepare Deployment Folder
          mkdir -p deploy_temp
          cp -r frontend/* deploy_temp/
          cd deploy_temp
          
          # 2. Create the mandatory HF Metadata file
          cat <<EOF > README.md
---
title: QR Elite Designer
emoji: 💎
colorFrom: indigo
colorTo: slate
sdk: static
pinned: false
---

# QR Elite Designer
Professional QR Identity Studio.
EOF
          
          # 3. Force Push to Hugging Face Space
          git init -b main
          git config user.email "bot@github.com"
          git config user.name "Deployment Bot"
          git add .
          git commit -m "Deploying professional frontend"
          
          # We use the token to push directly to the main branch of the space
          git remote add hf https://ShreyData:${HF_TOKEN}@huggingface.co/spaces/ShreyData/qr-elite
          git push -f hf main
