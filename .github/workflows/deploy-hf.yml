name: Deploy Frontend to Hugging Face

on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Force Sync to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Setup a clean deployment directory
          mkdir -p hf_deploy
          cp -r frontend/* hf_deploy/
          
          # 2. CREATE THE MANDATORY CONFIGURATION FILE
          # This MUST be named README.md and at the ROOT of the space
          cat <<EOF > hf_deploy/README.md
---
title: QR Elite
emoji: 🚀
colorFrom: indigo
colorTo: slate
sdk: static
pinned: false
---

# QR Elite Designer
Professional QR Identity Studio.
EOF
          
          # 3. Force Push to Hugging Face Space
          git init -b main
          git config user.email "deploy@example.com"
          git config user.name "Elite Deployer"
          git add .
          git commit -m "Force deploy professional UI"
          
          # Push only to main branch
          git remote add hf https://ShreyData:${HF_TOKEN}@huggingface.co/spaces/ShreyData/qr-elite
          git push -f hf main
