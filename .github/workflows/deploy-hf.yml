name: Deploy Frontend to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Prepare deployment directory
          mkdir -p hf_sync
          cp -r frontend/* hf_sync/
          cd hf_sync
          
          # 2. Add the mandatory HF configuration
          cat <<EOF > README.md
---
title: QR Elite Designer
emoji: 💎
colorFrom: indigo
colorTo: slate
sdk: static
pinned: false
---

# QR Elite Designer
Professional QR Identity Studio.
EOF

          # 3. Sync to Hugging Face
          git init -b main
          git config user.email "bot@github.com"
          git config user.name "HF Deploy Bot"
          git add .
          git commit -m "Deploy: Professional UI Update"
          
          # We use the token to push to the Space repo
          git push --force https://ShreyData:${HF_TOKEN}@huggingface.co/spaces/ShreyData/qr-elite main
